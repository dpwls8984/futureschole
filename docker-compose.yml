services:
  postgres:
    image: postgres:16
    container_name: futureschole-postgres
    environment:
      POSTGRES_DB: futureschole
      POSTGRES_USER: futureschole
      POSTGRES_PASSWORD: futureschole
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futureschole -d futureschole"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: futureschole-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"

volumes:
  postgres-data:
